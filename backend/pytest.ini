[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = . ..
markers =
    browser: mark test as requiring a real browser or Playwright
filterwarnings =
    ignore:.*iscoroutinefunction.*:DeprecationWarning:fastapi\..*
    ignore:.*iscoroutinefunction.*:DeprecationWarning:starlette\..*
    ignore:.*iscoroutinefunction.*:DeprecationWarning:pytest_asyncio\..*
    ignore:.*event_loop_policy.*:DeprecationWarning:pytest_asyncio\..*
    ignore:.*BlockingPortal.*:DeprecationWarning:starlette\..*
    ignore:.*_UnionGenericAlias.*:DeprecationWarning:google\.genai\..*
